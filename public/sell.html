<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Part - Electral</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>⚡ Electral</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/sell.html" class="active">Sell Part</a></li>
                <li><a href="/login.html" id="loginLink">Login</a></li>
                <li><a href="/profile.html" id="profileLink" style="display: none;">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="sell-container">
        <h2>List a New Part</h2>
        
        <form id="sellForm" class="sell-form">
            <div class="form-group">
                <label for="partName">Part Name:</label>
                <input type="text" id="partName" name="partName" required>
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option value="CPU">CPU</option>
                    <option value="GPU">GPU</option>
                    <option value="Memory">RAM/Memory</option>
                    <option value="Storage">Storage</option>
                    <option value="Phone Parts">Phone Parts</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="condition">Condition:</label>
                <select id="condition" name="condition" required>
                    <option value="">Select Condition</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                    <option value="Refurbished">Refurbished</option>
                    <option value="For Parts">For Parts</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">Price ($):</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-primary">List Part</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Electral - Electronic Parts Marketplace</p>
        <p>By Angela Monares and David De Leon</p>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
