<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Electral</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>⚡ Electral</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/sell.html">Sell Part</a></li>
                <li><a href="/login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Sign In</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-primary">Sign In</button>
                </div>

                <div class="form-links">
                    <a href="#">Forgot password?</a>
                </div>
            </form>

            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>

            <div class="form-group">
                <a href="/register.html" class="btn-secondary">Create New Account</a>
            </div>

            <div class="back-link">
                <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Electral - Electronic Parts Marketplace</p>
        <p>By Angela Monares and David De Leon</p>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
